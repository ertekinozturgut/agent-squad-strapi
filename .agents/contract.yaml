version: 2
project: "agent-squad-strapi"
frameworks:
  backend: "strapi-v5"
  frontend: "nextjs-react"

layers:
  domain:
    paths: ["src/types/**", "src/contracts/**", "backend/src/api/**/content-types/**"]
    may_depend_on: []
  services:
    paths: ["src/services/**", "src/features/*/services/**", "backend/src/api/**/services/**"]
    may_depend_on: [domain]
  hooks:
    paths: ["src/hooks/**", "src/features/*/hooks/**"]
    may_depend_on: [services, domain]
  components:
    paths: ["src/components/**", "src/features/*/components/**"]
    may_depend_on: [hooks, domain]
  routes_pages:
    paths: ["src/app/**", "src/pages/**", "src/routes/**"]
    may_depend_on: [components, hooks, services, domain]
  strapi_controllers:
    paths: ["backend/src/api/**/controllers/**"]
    may_depend_on: [services, domain]

banned_in:
  components:
    - "axios"
    - "fetch"
    - "knex"
    - "@strapi/strapi"
  hooks:
    - "knex"
    - "@strapi/strapi"
  strapi_controllers:
    - "knex"
    - "pg"
    - "mysql"
    - "sqlite3"
    - "better-sqlite3"
  client_bundle:
    - "process.env.STRAPI_ADMIN_API_TOKEN"
    - "process.env.DATABASE_PASSWORD"
    - "process.env.JWT_SECRET"

limits:
  function_max_lines: 25
  function_max_params: 3
  file_max_lines: 300
  cyclomatic_complexity: 10
  cognitive_complexity: 15
  nesting_depth: 3

pii:
  fields: ["tckn", "email", "phone", "password", "creditCard", "iban", "address", "birthDate"]
  storage_policy: "httpOnly-secure-cookie"
  forbidden_in: ["localStorage", "sessionStorage", "urlQuery", "unmaskedLogs"]
  sanitizer_helper: "DOMPurify.sanitize"

taint:
  sources:
    - "req.body"
    - "req.query"
    - "req.params"
    - "searchParams"
    - "cookies"
  sinks:
    dangerouslySetInnerHTML: ["dangerouslySetInnerHTML"]
    raw_sql: ["strapi.db.connection.raw", "knex.raw"]
    eval: ["eval", "Function"]
  sanitizers:
    - "DOMPurify.sanitize"
    - "strapi.utils.sanitize.contentAPI"

auth:
  strategy: "JWT"
  token_storage: "httpOnly_cookie"
  same_site: "strict"
  require_auth_guard: true
  strapi_rbac_enabled: true

integration:
  client_path: "src/services/apiClient.ts"
  correlation_header: "X-Correlation-Id"
  require_retry_policy: true
  require_circuit_breaker: true
  timeout_ms: 10000

crypto:
  banned_algorithms: ["md5", "sha1", "des", "rc4"]
  min_tls: "1.3"
  password_hash: "argon2id_or_bcrypt"

observability:
  require_correlation_id: true
  health_endpoints: ["/api/_health", "/api/healthz"]
  audit_operations: ["UserCreated", "RoleModified", "ContentPublished", "PermissionOverridden"]

mutation:
  include: ["src/features/**/hooks/**", "src/features/**/services/**", "backend/src/api/**/services/**"]
  exclude: ["**/*.test.*", "**/*.spec.*", "**/types/**", "**/mocks/**"]
  max_survived_on_changed: 0

supply_chain:
  allowed_registries: ["https://registry.npmjs.org/"]
  sbom_format: "cyclonedx"
  max_vulnerability_severity: "moderate"
